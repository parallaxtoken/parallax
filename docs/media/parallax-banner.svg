<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0C0A" />
      <stop offset="50%" stop-color="#16130E" />
      <stop offset="100%" stop-color="#080706" />
    </linearGradient>
    <radialGradient id="stellarGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7D00FF" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#00B07A" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshGlow" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Parallax Core Gradients -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F4EFE5" />
      <stop offset="100%" stop-color="#00B07A" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7D00FF" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#00B07A" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#stellarGlow)" />
  <rect width="1200" height="420" rx="16" fill="url(#meshGlow)" />
  <rect width="1200" height="420" rx="16" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Subtle Precision Grid -->
  <g opacity="0.08" stroke="#F4EFE5" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="420" stroke-dasharray="4 8" />
    <line x1="240" y1="0" x2="240" y2="420" stroke-dasharray="4 8" />
    <line x1="400" y1="0" x2="400" y2="420" stroke-dasharray="4 8" />
    <line x1="560" y1="0" x2="560" y2="420" stroke-dasharray="4 8" />
    <line x1="720" y1="0" x2="720" y2="420" stroke-dasharray="4 8" />
    <line x1="880" y1="0" x2="880" y2="420" stroke-dasharray="4 8" />
    <line x1="1040" y1="0" x2="1040" y2="420" stroke-dasharray="4 8" />
    <line x1="0" y1="100" x2="1200" y2="100" stroke-dasharray="4 8" />
    <line x1="0" y1="210" x2="1200" y2="210" stroke-dasharray="4 8" />
    <line x1="0" y1="320" x2="1200" y2="320" stroke-dasharray="4 8" />
  </g>

  <!-- Left Side: Brand Visual Geometric Emblem -->
  <g transform="translate(140, 210)">
    <!-- Outer Celestial Rings -->
    <circle cx="0" cy="0" r="110" stroke="url(#orbitGrad)" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.35" />
    <circle cx="0" cy="0" r="88" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
    <circle cx="0" cy="0" r="70" stroke="url(#orbitGrad)" stroke-width="3" stroke-dasharray="240 60" stroke-linecap="round" />
    
    <!-- Parallax Double Lens Structure -->
    <path d="M 0 -60 C 45 -25, 45 25, 0 60 C -45 25, -45 -25, 0 -60 Z" stroke="url(#orbitGrad)" stroke-width="3" fill="#7D00FF" fill-opacity="0.15" />
    <path d="M -60 0 C -25 45, 25 45, 60 0 C 25 -45, -25 -45, -60 0 Z" stroke="url(#orbitGrad)" stroke-width="3" fill="#00B07A" fill-opacity="0.15" />
    
    <!-- Core Star -->
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" filter="url(#softGlow)" />
    <circle cx="0" cy="0" r="7" fill="#7D00FF" />
    <circle cx="0" cy="0" r="3" fill="#00F0A0" />

    <!-- Orbital Coordinates -->
    <text x="0" y="135" text-anchor="middle" font-family="monospace" font-size="10" fill="#00B07A" letter-spacing="2">STELLAR :: SOROBAN RUST</text>
  </g>

  <!-- Right Side: Project Header & Positioning -->
  <g transform="translate(340, 110)">
    <!-- Subtitle Pill -->
    <rect x="0" y="0" width="310" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#00B07A" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#00B07A" />
    <text x="28" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#00B07A" letter-spacing="1.5">NON-CUSTODIAL RWA PROTOCOL</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="url(#brandGrad)" letter-spacing="-1.5">PARALLAX</text>

    <!-- Value Proposition -->
    <text x="0" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#F4EFE5" opacity="0.95">The real price of tokenized stocks, net of the wrapper.</text>
    <text x="0" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#A8A095">Standing orders executed in real shares. Refused at chain level if under-delivered.</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 185)">
      <!-- Badge 1: Stellar Soroban -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="8" fill="#1C1814" stroke="#7D00FF" stroke-opacity="0.5" stroke-width="1.2" />
        <text x="14" y="22" font-family="monospace" font-size="12" font-weight="600" fill="#FFFFFF">Stellar Soroban</text>
        <circle cx="162" cy="17" r="4" fill="#7D00FF" />
      </g>

      <!-- Badge 2: Invariant Floor -->
      <g transform="translate(192, 0)">
        <rect width="185" height="34" rx="8" fill="#1C1814" stroke="#00B07A" stroke-opacity="0.5" stroke-width="1.2" />
        <text x="14" y="22" font-family="monospace" font-size="12" font-weight="600" fill="#FFFFFF">Atomic ShareFloor</text>
        <circle cx="167" cy="17" r="4" fill="#00B07A" />
      </g>

      <!-- Badge 3: 24/7 Execution -->
      <g transform="translate(389, 0)">
        <rect width="175" height="34" rx="8" fill="#1C1814" stroke="#00D2FF" stroke-opacity="0.5" stroke-width="1.2" />
        <text x="14" y="22" font-family="monospace" font-size="12" font-weight="600" fill="#FFFFFF">24/7 Autonomous</text>
        <circle cx="157" cy="17" r="4" fill="#00D2FF" />
      </g>

      <!-- Badge 4: Zero Custody -->
      <g transform="translate(576, 0)">
        <rect width="150" height="34" rx="8" fill="#1C1814" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.2" />
        <text x="14" y="22" font-family="monospace" font-size="12" font-weight="600" fill="#F4EFE5">100% Non-Custodial</text>
        <circle cx="132" cy="17" r="4" fill="#FFFFFF" opacity="0.8" />
      </g>
    </g>
  </g>
</svg>

