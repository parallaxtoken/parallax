name: keepalive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake and check the hosted keeper
        run: |
          for endpoint in "https://web-mu-rosy-80.vercel.app/api/agent/keeper" "https://parallax-keeper.onrender.com/healthz"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$endpoint" || true)
            echo "$endpoint: $code"
            [ "$code" = "200" ] && exit 0
          done
          exit 0
