name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HAS_RPC: ${{ secrets.BSC_RPC_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Unit tests
        run: pnpm -r --if-present test
      - name: Protocol hygiene tests
        run: pnpm test:hygiene
      - name: E2E opaque-box requirements test suite
        run: pnpm test:e2e
      - name: Type check
        run: pnpm -r --if-present typecheck
      - name: Claims ledger and numbers
        run: npx tsx scripts/check_claims.ts
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Stellar Soroban Contracts Test Suite
        run: |
          cd contracts/soroban
          cargo test -- --nocapture 2>&1 | tee test_output.log || (cat test_output.log && exit 1)
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install Foundry dependencies
        run: |
          cd contracts
          rm -rf lib
          mkdir -p lib
          git clone --depth 1 https://github.com/foundry-rs/forge-std.git lib/forge-std
          git clone --depth 1 --branch v5.1.0 https://github.com/OpenZeppelin/openzeppelin-contracts.git lib/openzeppelin-contracts
      - name: Contracts build
        run: cd contracts && forge build
      - name: Fork break suite
        if: env.HAS_RPC == 'true'
        env:
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
        run: cd contracts && forge test -vv
      - name: Verifier against committed mainnet evidence
        run: |
          grep -q "PASS" evidence/mainnet/verify_order_0.txt
          ! grep -q "FAIL" evidence/mainnet/verify_order_0.txt
